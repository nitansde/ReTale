name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.x

      - name: Install dependencies
        run: npm ci
        env:
          RETALE_SKIP_HANLP_SETUP: '1'

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Next route types and run full typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:all

      - name: Build production application
        run: npm run build

      - name: Check Next production build safety
        run: npm run check:next-build-safety

      - name: Verify production runtime freshness
        run: npm run verify:production-freshness

      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence-${{ github.sha }}
          path: tests/artifacts/evidence/task-1-test-harness/ui
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence-${{ github.sha }}
          path: tests/artifacts/evidence/performance-characterization
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload Next build safety evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build-safety-evidence-${{ github.sha }}
          path: tests/artifacts/evidence/next-build-safety
          if-no-files-found: ignore
          include-hidden-files: true
